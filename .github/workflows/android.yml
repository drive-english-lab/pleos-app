name: Android checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK Platform 36
        run: test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Check generated learning contracts
        run: |
          python3 scripts/sync-learning-contracts.py --check
          python3 scripts/sync-feature-contracts.py --check
          python3 scripts/sync-incremental-contracts.py --check
          python3 scripts/sync-r7-contracts.py --check
      - name: Download verified Gradle distribution
        run: |
          archive="$RUNNER_TEMP/gradle-8.13-bin.zip"
          # Gradle 8.13 official release asset. The REST API serves the signed asset URL.
          curl --fail --silent --show-error --location --retry 2 \
            -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/232373824 \
            -o "$archive"
          checksum="$(sed -n 's/^distributionSha256Sum=//p' gradle/wrapper/gradle-wrapper.properties)"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
      - run: |
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --console=plain \
            -PkotlinCompilerRepository=https://maven-central.storage-download.googleapis.com/maven2 \
            :core:domain:test :app:assembleDebug :app:assembleRelease :app:lintDebug
